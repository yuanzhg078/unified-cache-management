# Canonical KV metrics definition.
#
# The generator uses this file to create the portable KvMetricId header, the
# standalone default descriptors, and the KV sections in UCM's YAML/Python
# defaults. It contains only KV client/transport metrics.
metric_prefix: "ucm:"

counter:
  - {id: "QueryRequests", name: "kv_client_query_requests_total", documentation: "Total KV client query submissions"}
  - {id: "QueryEntries", name: "kv_client_query_entries_total", documentation: "Total keys submitted to KV client query"}
  - {id: "QueryErrors", name: "kv_client_query_errors_total", documentation: "Total failed KV client query submissions"}
  - {id: "LoadRequests", name: "kv_client_load_requests_total", documentation: "Total KV client load submissions"}
  - {id: "LoadEntries", name: "kv_client_load_entries_total", documentation: "Total entries submitted to KV client load"}
  - {id: "LoadErrors", name: "kv_client_load_errors_total", documentation: "Total failed KV client load submissions"}
  - {id: "StoreRequests", name: "kv_client_store_requests_total", documentation: "Total KV client store submissions"}
  - {id: "StoreEntries", name: "kv_client_store_entries_total", documentation: "Total entries submitted to KV client store"}
  - {id: "StoreErrors", name: "kv_client_store_errors_total", documentation: "Total failed KV client store submissions"}
  - {id: "BatchLoadRequests", name: "kv_client_batch_load_requests_total", documentation: "Total KV client batch-load submissions"}
  - {id: "BatchLoadEntries", name: "kv_client_batch_load_entries_total", documentation: "Total entries submitted to KV client batch-load"}
  - {id: "BatchLoadErrors", name: "kv_client_batch_load_errors_total", documentation: "Total failed KV client batch-load submissions"}
  - {id: "BatchStoreRequests", name: "kv_client_batch_store_requests_total", documentation: "Total KV client batch-store submissions"}
  - {id: "BatchStoreEntries", name: "kv_client_batch_store_entries_total", documentation: "Total entries submitted to KV client batch-store"}
  - {id: "BatchStoreErrors", name: "kv_client_batch_store_errors_total", documentation: "Total failed KV client batch-store submissions"}
  - {id: "DeleteRequests", name: "kv_client_delete_requests_total", documentation: "Total KV client delete submissions"}
  - {id: "DeleteEntries", name: "kv_client_delete_entries_total", documentation: "Total keys submitted to KV client delete"}
  - {id: "DeleteErrors", name: "kv_client_delete_errors_total", documentation: "Total failed KV client delete submissions"}
  - {id: "WaitRequests", name: "kv_client_wait_requests_total", documentation: "Total KV client wait calls"}
  - {id: "WaitErrors", name: "kv_client_wait_errors_total", documentation: "Total failed KV client wait calls"}
  - {id: "ClientTaskQueueWaitNotified", name: "kv_client_task_queue_wait_notified_total", documentation: "KV client queue waits completed by notification"}
  - {id: "ClientTaskQueueWaitTimeouts", name: "kv_client_task_queue_wait_timeout_total", documentation: "KV client queue waits completed by timeout"}
  - {id: "ClientTaskQueueNotifies", name: "kv_client_task_queue_notify_total", documentation: "KV client queue notifications"}
  - {id: "TransportTaskQueueWaitNotified", name: "kv_transport_task_queue_wait_notified_total", documentation: "KV transport queue waits completed by notification"}
  - {id: "TransportTaskQueueWaitTimeouts", name: "kv_transport_task_queue_wait_timeout_total", documentation: "KV transport queue waits completed by timeout"}
  - {id: "TransportTaskQueueNotifies", name: "kv_transport_task_queue_notify_total", documentation: "KV transport queue notifications"}
  - {id: "ExporterHttpRequests", name: "kv_metrics_exporter_http_requests_total", documentation: "HTTP requests served by the KV metrics endpoint"}

gauge:
  - {id: "ExporterUp", name: "kv_metrics_exporter_up", documentation: "Whether the KV standalone metrics exporter is running", multiprocess_mode: "livemostrecent"}

histogram:
  - {id: "QuerySubmitDuration", name: "kv_client_query_submit_duration_seconds", documentation: "KV client query submission duration", buckets: [0.00001, 0.00005, 0.0001, 0.0005, 0.001, 0.005, 0.01, 0.05, 0.1, 0.5, 1.0]}
  - {id: "LoadSubmitDuration", name: "kv_client_load_submit_duration_seconds", documentation: "KV client load submission duration", buckets: [0.00001, 0.00005, 0.0001, 0.0005, 0.001, 0.005, 0.01, 0.05, 0.1, 0.5, 1.0]}
  - {id: "StoreSubmitDuration", name: "kv_client_store_submit_duration_seconds", documentation: "KV client store submission duration", buckets: [0.00001, 0.00005, 0.0001, 0.0005, 0.001, 0.005, 0.01, 0.05, 0.1, 0.5, 1.0]}
  - {id: "BatchLoadSubmitDuration", name: "kv_client_batch_load_submit_duration_seconds", documentation: "KV client batch-load submission duration", buckets: [0.00001, 0.00005, 0.0001, 0.0005, 0.001, 0.005, 0.01, 0.05, 0.1, 0.5, 1.0]}
  - {id: "BatchStoreSubmitDuration", name: "kv_client_batch_store_submit_duration_seconds", documentation: "KV client batch-store submission duration", buckets: [0.00001, 0.00005, 0.0001, 0.0005, 0.001, 0.005, 0.01, 0.05, 0.1, 0.5, 1.0]}
  - {id: "DeleteSubmitDuration", name: "kv_client_delete_submit_duration_seconds", documentation: "KV client delete submission duration", buckets: [0.00001, 0.00005, 0.0001, 0.0005, 0.001, 0.005, 0.01, 0.05, 0.1, 0.5, 1.0]}
  - {id: "WaitDuration", name: "kv_client_wait_duration_seconds", documentation: "KV client wait duration", buckets: [0.00001, 0.00005, 0.0001, 0.0005, 0.001, 0.005, 0.01, 0.05, 0.1, 0.5, 1.0]}
  - {id: "ClientTaskEnqueueDuration", name: "kv_client_task_enqueue_duration_seconds", documentation: "KV client API-to-enqueue duration", buckets: [0.00001, 0.00005, 0.0001, 0.0005, 0.001, 0.005, 0.01, 0.05, 0.1, 0.5, 1.0]}
  - {id: "ClientTaskQueueDuration", name: "kv_client_task_queue_duration_seconds", documentation: "KV client task queue duration", buckets: [0.00001, 0.00005, 0.0001, 0.0005, 0.001, 0.005, 0.01, 0.05, 0.1, 0.5, 1.0]}
  - {id: "ClientTaskProcessDuration", name: "kv_client_task_process_duration_seconds", documentation: "KV client task processing duration", buckets: [0.00001, 0.00005, 0.0001, 0.0005, 0.001, 0.005, 0.01, 0.05, 0.1, 0.5, 1.0]}
  - {id: "ClientTaskPreSendDuration", name: "kv_client_task_pre_send_duration_seconds", documentation: "KV client duration until all transport tasks reach Send", buckets: [0.00001, 0.00005, 0.0001, 0.0005, 0.001, 0.005, 0.01, 0.05, 0.1, 0.5, 1.0]}
  - {id: "ClientTaskSendDuration", name: "kv_client_task_send_duration_seconds", documentation: "KV client duration until all Send calls return", buckets: [0.00001, 0.00005, 0.0001, 0.0005, 0.001, 0.005, 0.01, 0.05, 0.1, 0.5, 1.0]}
  - {id: "ClientTaskDuration", name: "kv_client_task_duration_seconds", documentation: "KV client task end-to-end duration", buckets: [0.00001, 0.00005, 0.0001, 0.0005, 0.001, 0.005, 0.01, 0.05, 0.1, 0.5, 1.0]}
  - {id: "TransportTaskPreSendDuration", name: "kv_transport_task_pre_send_duration_seconds", documentation: "KV transport duration before Send", buckets: [0.00001, 0.00005, 0.0001, 0.0005, 0.001, 0.005, 0.01, 0.05, 0.1, 0.5, 1.0]}
  - {id: "TransportTaskQueueDuration", name: "kv_transport_task_queue_duration_seconds", documentation: "KV transport task queue duration", buckets: [0.00001, 0.00005, 0.0001, 0.0005, 0.001, 0.005, 0.01, 0.05, 0.1, 0.5, 1.0]}
  - {id: "TransportTaskProcessDuration", name: "kv_transport_task_process_duration_seconds", documentation: "KV transport task processing duration", buckets: [0.00001, 0.00005, 0.0001, 0.0005, 0.001, 0.005, 0.01, 0.05, 0.1, 0.5, 1.0]}
  - {id: "TransportTaskSendDuration", name: "kv_transport_task_send_duration_seconds", documentation: "KV transport duration until Send returns", buckets: [0.00001, 0.00005, 0.0001, 0.0005, 0.001, 0.005, 0.01, 0.05, 0.1, 0.5, 1.0]}
  - {id: "TransportTaskCompletionDuration", name: "kv_transport_task_completion_duration_seconds", documentation: "KV transport completion callback duration after Send", buckets: [0.00001, 0.00005, 0.0001, 0.0005, 0.001, 0.005, 0.01, 0.05, 0.1, 0.5, 1.0]}
  - {id: "FakeBackendTaskQueueDuration", name: "kv_fake_backend_task_queue_duration_seconds", documentation: "KV fake backend task queue duration", buckets: [0.00001, 0.00005, 0.0001, 0.0005, 0.001, 0.005, 0.01, 0.05, 0.1, 0.5, 1.0]}
  - {id: "FakeBackendTaskProcessDuration", name: "kv_fake_backend_task_process_duration_seconds", documentation: "KV fake backend processing duration", buckets: [0.00001, 0.00005, 0.0001, 0.0005, 0.001, 0.005, 0.01, 0.05, 0.1, 0.5, 1.0]}
