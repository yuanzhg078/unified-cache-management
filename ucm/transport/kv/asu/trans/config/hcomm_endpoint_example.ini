# Example HCOMM endpoint config for one local ASU client.
#
# Usage:
#   transport_config.attrs["endpoint_config_file"] =
#       "ucm/transport/kv/asu/trans/config/hcomm_endpoint_example.ini";
#
# Values here are examples. Replace addresses, device ids, and remote buffer
# addresses with values from the real deployment.
#
# This file provides common HCOMM attrs. Configure remote ASU endpoints in
# TransportConfig::endpoints, for example:
#
#   transport_config.endpoints = {
#       AsuEndpoint{.ip = "192.168.1.11", .port = 6000,
#                   .protocol = Protocol::UB, .device_id = 1},
#       AsuEndpoint{.ip = "192.168.1.12", .port = 6000,
#                   .protocol = Protocol::UB, .device_id = 2},
#   };
#
# The client then connects to two remote endpoints:
#
#   local 192.168.1.10 -> remote ASU 192.168.1.11
#   local 192.168.1.10 -> remote ASU 192.168.1.12

protocol = uboe
placement = device
port = 6000

local.comm_id = 192.168.1.10
local.phy_device_id = 0

tc = 0
sl = 0
send_size = 4096
flag_size = 8
remote_send_addr = 0x100000000
remote_flag_addr = 0x200000000
